# Local / self-hosted: app + Postgres. `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskmanager?schema=public
      JOBS_INLINE: "true"
      # Secrets are REQUIRED (no public defaults). Put them in .env next to this file:
      #   AUTH_SECRET=$(openssl rand -base64 32)  VAULT_ENCRYPTION_KEY=$(openssl rand -base64 32)  CRON_SECRET=$(openssl rand -hex 24)
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 32)}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?set VAULT_ENCRYPTION_KEY (openssl rand -base64 32)}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET (openssl rand -hex 24)}
      # Demo / mock behaviour is OFF by default. For a local try-out set GOOGLE_MOCK=true DEMO_LOGIN=true SEED_DEMO=true
      # ALLOW_DEMO_IN_PRODUCTION=true in .env (the container runs NODE_ENV=production, so the escape hatch is needed; UNSAFE).
      GOOGLE_MOCK: ${GOOGLE_MOCK:-false}
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      ALLOW_DEMO_IN_PRODUCTION: ${ALLOW_DEMO_IN_PRODUCTION:-false}
    ports:
      - "3000:3000"
volumes:
  pgdata:
