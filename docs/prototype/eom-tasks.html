<title>EraOfMarketing Tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#eef5fb;--fg:#111827;--muted:#6b7280;--line:rgba(255,255,255,.7);
  --cyan:#22c3e6;--cyan2:#5ed6f0;--cyanpill:rgba(255,255,255,.55);--cyanpill-on:rgba(255,255,255,.88);--cyanring:#0e7490;
  --green:#5fc46a;--greenbar:#2db84a;--greenpill:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.8);--chip:rgba(255,255,255,.62);
  --row-white:rgba(255,255,255,.55);--row-green:rgba(212,245,214,.75);--row-yellow:rgba(255,243,196,.8);--row-red:rgba(251,213,213,.8);--row-grey:rgba(233,233,233,.7);
  --ink:#111;--blue:#1e63d6;--red:#ef4444;--amber:#f59e0b;--violet:#7c3aed;--okgreen:#16a34a;
  --shadow:0 8px 24px rgba(16,24,40,.1),inset 0 1px 0 rgba(255,255,255,.75);
  --aurora:radial-gradient(900px 600px at 10% -10%,#c7f0fb 0%,transparent 60%),radial-gradient(800px 600px at 110% 10%,#d6f5dc 0%,transparent 55%),radial-gradient(700px 500px at 50% 110%,#e6e0fb 0%,transparent 55%),linear-gradient(180deg,#eef5fb 0%,#e9eef6 100%);
  --frame:rgba(255,255,255,.35);--sheet:rgba(255,255,255,.86);--input:rgba(255,255,255,.6);--dim:rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1420;--fg:#e5e7eb;--muted:#9ca3af;--line:rgba(255,255,255,.14);
  --glass:rgba(30,36,50,.6);--glass-strong:rgba(30,36,50,.85);--chip:rgba(255,255,255,.14);
  --row-white:rgba(255,255,255,.07);--row-green:rgba(34,120,60,.35);--row-yellow:rgba(170,130,20,.3);--row-red:rgba(170,50,50,.35);--row-grey:rgba(255,255,255,.12);
  --ink:#f3f4f6;--shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
  --aurora:radial-gradient(900px 600px at 10% -10%,#123a4a 0%,transparent 60%),radial-gradient(800px 600px at 110% 10%,#143a22 0%,transparent 55%),linear-gradient(180deg,#0f1420 0%,#0b0f18 100%);
  --frame:rgba(255,255,255,.04);--sheet:rgba(24,28,40,.94);--input:rgba(255,255,255,.08);--dim:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1420;--fg:#e5e7eb;--muted:#9ca3af;--line:rgba(255,255,255,.14);
  --glass:rgba(30,36,50,.6);--glass-strong:rgba(30,36,50,.85);--chip:rgba(255,255,255,.14);
  --row-white:rgba(255,255,255,.07);--row-green:rgba(34,120,60,.35);--row-yellow:rgba(170,130,20,.3);--row-red:rgba(170,50,50,.35);--row-grey:rgba(255,255,255,.12);
  --ink:#f3f4f6;--shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
  --aurora:radial-gradient(900px 600px at 10% -10%,#123a4a 0%,transparent 60%),radial-gradient(800px 600px at 110% 10%,#143a22 0%,transparent 55%),linear-gradient(180deg,#0f1420 0%,#0b0f18 100%);
  --frame:rgba(255,255,255,.04);--sheet:rgba(24,28,40,.94);--input:rgba(255,255,255,.08);--dim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--aurora),var(--bg);background-attachment:fixed;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
.phone{width:100%;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--frame);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(16,24,40,.12);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}
.grow{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--line);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.06),inset 0 1px 0 rgba(255,255,255,.5);border-radius:6px;padding:2px 8px;font-size:12px;line-height:16px;color:var(--ink);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.chip.me{font-weight:600;color:#1e40af}
.chip.meet{color:#6d28d9}
.pill{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 10px;font-size:11px;line-height:1;white-space:nowrap;flex-shrink:0;color:var(--ink);background:var(--chip);border:1px solid var(--line)}
/* cyan zone */
.cyan{background:linear-gradient(160deg,rgba(34,195,230,.88) 0%,rgba(34,195,230,.72) 60%,rgba(94,214,240,.78) 100%);box-shadow:inset 0 -1px 0 rgba(255,255,255,.45);padding:0 10px 8px;flex-shrink:0;padding-top:env(safe-area-inset-top,0px)}
.topbar{height:26px;display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.75)}
.topbar .r{display:flex;align-items:center;gap:10px}
.ico{display:flex;align-items:center;justify-content:center;width:28px;height:26px;position:relative}
.badge{position:absolute;right:-4px;top:0;min-width:14px;height:14px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;font-weight:700;line-height:14px;text-align:center;padding:0 3px}
.avatar{width:22px;height:22px;border-radius:999px;background:#fff;color:#0e7490;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:.85}
.cols{display:flex;gap:12px;margin-top:6px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;height:192px;overflow-y:auto;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.col.end{align-items:flex-end}.col.start{align-items:flex-start}
.cpill{height:32px;flex-shrink:0;display:flex;align-items:center;border-radius:6px;padding:0 10px;font-size:13px;font-weight:700;color:#111;background:var(--cyanpill);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 2px rgba(14,116,144,.12),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.55);width:100%;text-align:left;min-width:0}
.col.end .cpill,.col.start .cpill{width:auto;max-width:100%}
.cpill.on{background:var(--cyanpill-on);box-shadow:inset 0 0 0 2px var(--cyanring)}
.cpill .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpill .h{flex-shrink:0;white-space:pre}
/* rows */
.list{list-style:none;margin:0;padding:0}
.row{position:relative;border-bottom:1px solid var(--line);padding:8px 12px 8px 14px;cursor:pointer}
.row.white{background:var(--row-white)}.row.green{background:var(--row-green)}.row.yellow{background:var(--row-yellow)}.row.red{background:var(--row-red)}.row.grey{background:var(--row-grey)}
.row .title{display:flex;align-items:center;gap:6px}
.row .title b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;line-height:20px;color:var(--ink)}
.row.grey .title b{text-decoration:line-through;opacity:.7}
.row .names{margin-left:4px;font-size:12px;font-weight:600;text-transform:lowercase;color:var(--muted);flex-shrink:0}
.row .body{margin-top:4px;display:flex;align-items:center;gap:8px}
.row .left{min-width:0;flex:1}
.row .chips{display:flex;gap:6px;overflow:hidden}
.row .icons{margin-top:6px;display:flex;gap:10px}
.row .icons button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.row .icons button[disabled]{opacity:.35;cursor:default}
.rpills{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.rpills .pill{position:relative}
.rpills .pill.b{font-weight:700}.rpills .pill.od{color:#dc2626}.rpills .pill.dim{color:var(--muted);opacity:.85}
.reddot{position:absolute;top:-4px;width:11px;height:11px;border-radius:999px;background:var(--red)}
.reddot.tl{left:-4px}.reddot.tr{right:-4px}
.circle{width:30px;height:30px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:rgba(255,255,255,.4);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.circle.started{border-color:#16a34a}.circle.doubt{background:#f5b800;border-color:#f5b800}
.restartTag{position:absolute;left:-2px;top:10px;width:16px;height:16px;border-radius:999px;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center}
.pauseTag{width:18px;height:18px;border-radius:999px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
/* bottom zone */
.bottom{flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.strip{height:40px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;border-top:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.itog{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.itog.on{background:#111;color:#fff}
.comp{height:22px;border-radius:999px;padding:0 10px;font-size:11px;color:#9ca3af;background:var(--chip);border:1px solid var(--line);flex-shrink:0}
.comp.on{background:#9ca3af;color:#fff}
.sw{width:46px;height:18px;border-radius:5px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.08);flex-shrink:0}
.sw.on{box-shadow:inset 0 0 0 2px #111}
.rdbtn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rdbtn.on{background:#111}
.rdbtn i{display:block;width:12px;height:12px;border-radius:999px;background:var(--red)}
.greenarea{background:linear-gradient(160deg,rgba(95,196,106,.85) 0%,rgba(95,196,106,.72) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.prow{height:34px;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.prow::-webkit-scrollbar{display:none}
.gp{height:22px;border-radius:999px;padding:0 10px;font-size:11px;line-height:1;color:#111;background:var(--greenpill);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 0 0 1px rgba(255,255,255,.5);flex-shrink:0;white-space:nowrap}
.gp.on{background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.bar{height:44px;display:flex}
.bar .g{flex:62;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:0 10px;background:linear-gradient(160deg,rgba(45,184,74,.9),rgba(45,184,74,.78));color:#fff;scrollbar-width:none}
.bar .g::-webkit-scrollbar{display:none}
.bar .w{flex:38;display:flex;align-items:center;justify-content:space-evenly;padding:0 4px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink)}
.bar .w .pill{font-size:11px}
.sq{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sq.on{background:rgba(0,0,0,.08);border-radius:6px}
/* sheets */
.dim{position:absolute;inset:0;background:var(--dim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:30;display:flex;align-items:flex-end}
.dim[hidden]{display:none!important}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--sheet);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 10px;font-size:15px;font-weight:700}
.sheet .grab{width:36px;height:4px;border-radius:999px;background:var(--muted);opacity:.4;margin:0 auto 10px}
.al{display:flex;flex-direction:column;gap:6px}
.al button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);text-align:left}
.al button span{font-size:14px;font-weight:600}
.al button small{font-size:11px;color:var(--muted)}
.al button.danger span{color:#dc2626}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.field .hint{font-size:11px;color:var(--muted)}
.in{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--input);padding:8px 10px;font-size:14px;outline:none;min-width:0}
.in:focus{border-color:var(--blue)}
textarea.in{resize:vertical;min-height:70px}
.btn{height:40px;border-radius:12px;padding:0 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#111;color:#fff;flex:1}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--blue)}.btn.green{background:var(--okgreen)}.btn.red{background:#dc2626}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;margin-top:8px}
.toast{position:absolute;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(17,17,17,.88);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;z-index:50;pointer-events:none;max-width:90%;text-align:center;transition:opacity .2s}
.toast.err{background:#b91c1c}
.toast[hidden]{display:none!important}
/* generic screens */
.hdr{height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-shrink:0}
.hdr b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr button{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);margin:0 12px 10px}
.card h4{margin:0 0 6px;font-size:13px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 12px 10px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.tile small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tile b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:600;border:1px solid var(--line);white-space:nowrap;flex-shrink:0;line-height:1.3}
.tagrow{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;align-items:center}
.a4 .stamp{position:absolute;top:330px;left:50%;transform:translateX(-50%) rotate(-24deg);border:5px solid #dc2626;color:#dc2626!important;font-size:58px;font-weight:900;letter-spacing:.08em;padding:4px 22px;border-radius:10px;opacity:.55;pointer-events:none}
.a4 .stamp *{color:#dc2626!important}
.cxl{margin:12px 12px 0;padding:10px 12px;border-radius:12px;background:var(--row-red);font-size:12.5px}
.tag.draft{background:var(--chip);color:var(--ink)}.tag.await{background:rgba(254,243,199,.8);color:#92400e}.tag.sent{background:rgba(224,231,255,.8);color:#3730a3}.tag.paid{background:rgba(220,252,231,.8);color:#166534}.tag.ppart{background:rgba(254,243,199,.8);color:#92400e}.tag.over{background:rgba(254,226,226,.8);color:#991b1b}.tag.sched{background:rgba(219,234,254,.8);color:#1e40af}.tag.canc{background:var(--chip);color:var(--muted);text-decoration:line-through}
.tag.tax{background:rgba(224,242,254,.8);color:#0c4a6e}.tag.exp{background:rgba(204,251,241,.8);color:#134e4a}.tag.pro{background:rgba(237,233,254,.8);color:#4c1d95}.tag.cn{background:rgba(255,228,230,.8);color:#881337}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--row-white)}
.item .m{flex:1;min-width:0}
.item .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;flex-shrink:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:30px;border-radius:999px;padding:0 12px;font-size:12px;font-weight:500;background:var(--chip);border:1px solid var(--line);color:var(--ink)}
.seg button.on{background:#111;color:#fff;border-color:#111}
.menu{position:absolute;inset:0;z-index:40;display:flex;background:rgba(0,0,0,.15);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.menu[hidden]{display:none!important}
.menu nav{position:relative;height:100%;width:74%;max-width:360px;overflow-y:auto;display:flex;flex-direction:column;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:76px 20px 12px;padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:8px 0 40px rgba(16,24,40,.15)}
.menu .addc{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end}
.menu .addc span{font-size:38px;font-weight:300;line-height:1}
.menu .addc small{width:84px;text-align:right;font-size:8px;line-height:10px;color:var(--muted);margin-top:2px}
.menu ul{list-style:none;margin:0;padding:0}
.menu li.g{margin-top:36px}.menu li.g:first-child{margin-top:0}
.menu li button{display:block;padding:4px 0;font-size:19px;line-height:24px;color:var(--ink);text-align:left}
.menu .addt{align-self:flex-end;margin-top:36px;font-size:46px;font-weight:300;line-height:1}
.menu .foot{margin-top:auto;padding-top:20px;display:flex;gap:16px;font-size:11px;color:var(--muted)}
.menu .foot .so{color:#dc2626}
.demo{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(17,17,17,.45);color:#fff;backdrop-filter:blur(6px);height:18px;display:flex;align-items:center}
.pf{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px 16px;gap:10px}
.pf h1{margin:0;font-size:22px;font-weight:800;text-align:center;text-wrap:balance}
.pf p{margin:0;color:var(--muted);text-align:center;font-size:13px;max-width:34ch}
.rolebtn{width:100%;max-width:320px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.rolebtn .av{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.rolebtn b{display:block;font-size:14px}.rolebtn small{display:block;font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.addhdr{min-height:190px;display:flex;flex-direction:column;gap:8px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));color:#111;background:linear-gradient(160deg,rgba(34,195,230,.88),rgba(34,195,230,.72) 60%,rgba(94,214,240,.78));flex-shrink:0}
.ltile{height:34px;width:fit-content;min-width:196px;display:flex;align-items:center;border-radius:6px;padding:0 12px;font-size:14px;background:var(--cyanpill);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 1px rgba(255,255,255,.55);white-space:pre}
.addbody{padding:12px}

.bz{background:var(--glass);border-top:1px solid var(--hair);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -18px rgba(15,40,70,.4)}
.bz .r1{padding:12px 12px 6px;gap:8px}
.bz .r2{padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));gap:10px}
.bz .r1 .gp{height:32px;font-size:12.5px;padding:0 14px}

/* ---- controls ---- */
.btn{height:46px;border-radius:14px;font-size:15px;letter-spacing:-.01em;background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--hair);box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.btn.blue{background:linear-gradient(160deg,#3b82f6,#2563eb);color:#fff}
.btn.green{background:linear-gradient(160deg,#10b981,#059669);color:#fff}
.btn.red{background:linear-gradient(160deg,#f87171,#dc2626);color:#fff}
.seg{gap:8px}
.seg button{height:34px;padding:0 14px;font-size:12.5px;border:1px solid var(--hair);background:var(--chip)}
.seg button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.field{gap:6px;margin-bottom:16px}
.field label{font-size:10.5px;letter-spacing:.07em;font-weight:700}
.field .hint{font-size:11.5px;line-height:1.35}
.in{height:44px;border-radius:12px;padding:0 14px;font-size:15px;border:1px solid var(--hair);background:var(--input);box-shadow:inset 0 1px 2px rgba(15,40,70,.06)}
textarea.in{height:auto;padding:12px 14px;min-height:84px;line-height:1.4}
select.in{padding-right:10px}
.in:focus{border-color:#38bdf8;box-shadow:0 0 0 4px rgba(56,189,248,.18)}
.check{padding:12px 14px;gap:12px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);margin-bottom:10px}
.check input{width:20px;height:20px;accent-color:#0ea5e9}
.btnrow{gap:10px;margin-top:12px}

/* ---- sheets & menu ---- */
.dim{background:rgba(2,12,24,.35)}
.sheet{padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:var(--sheet);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-top:1px solid var(--hair);box-shadow:0 -20px 60px -20px rgba(0,0,0,.45)}
.sheet .grab{width:40px;height:5px;margin:2px auto 14px;opacity:.35}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0 0 16px}
.al{gap:8px}
.al button{padding:12px 14px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);gap:3px}
.al button span{font-size:15px}
.al button small{font-size:12px}
.menu{background:rgba(2,12,24,.28)}
.menu nav{background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--hair);border-radius:0 26px 26px 0;padding-left:24px;padding-right:24px}
.menu li button{font-size:18px;padding:6px 0;letter-spacing:-.01em}
.menu li.g{margin-top:28px}
.toast{background:rgba(11,27,43,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}

/* ---- add task body ---- */
.addbody{padding:16px}
.ta{font-size:18px;font-weight:700;letter-spacing:-.015em}
.ta.desc{font-size:15px;font-weight:400;min-height:72px;margin-top:4px}
.mini{gap:8px;margin-top:8px}
.hrs{gap:8px;margin-top:16px}
.step{height:34px}
.voice{margin-top:16px;gap:14px}
.micbtn{width:60px;height:60px;background:linear-gradient(160deg,#1f2937,#0b1220);box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.slot{margin-top:14px;font-size:12.5px;line-height:1.4}
.recsum{border-radius:14px;padding:12px 14px;background:rgba(14,165,233,.14);color:#0369a1;border:1px solid rgba(14,165,233,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .recsum{color:#7dd3fc}}
:root[data-theme="dark"] .recsum{color:#7dd3fc}
.pf{gap:12px;padding:32px 20px}
.pf h1{font-size:26px;letter-spacing:-.025em}
.rolebtn{padding:14px 16px;border-radius:18px;max-width:340px}
/* row density pass */
.row{padding:12px 12px 10px 16px}
.row .body{margin-top:6px;align-items:center}
.row .chips{flex-wrap:wrap;gap:6px;overflow:visible}
.row .chip{height:22px;font-size:11.5px;padding:0 9px;max-width:150px}
.row .icons{margin-top:6px}
.rpills{gap:4px}
.rpills .pill{height:23px;padding:0 9px;font-size:11px}
.circle{width:32px;height:32px}
/* selected states read in both themes */
.hrs .pill.on,.mini .pill.on{background:var(--primary)!important;color:var(--primary-ink)!important;border-color:transparent}
.wd button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.itog.on,.rdbtn.on{background:var(--primary);color:var(--primary-ink)}
.cl button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.cl button{height:38px;padding:0 14px;border:1px solid var(--hair);background:var(--chip)}
.addbody > div[style*="position:sticky"]{bottom:12px}
/* amber notes stay readable in dark mode */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card[style*="254,243,199"]{background:rgba(245,158,11,.14)!important;color:#fcd34d!important;border-color:rgba(245,158,11,.3)}}
:root[data-theme="dark"] .card[style*="254,243,199"]{background:rgba(245,158,11,.14)!important;color:#fcd34d!important;border-color:rgba(245,158,11,.3)}

/* ===== Menu redesign: thumb-first bottom sheet ===== */
.menu{align-items:flex-end;justify-content:center;background:rgba(2,12,24,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.menu nav{display:none}
.msheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:var(--sheet);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--hair);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -24px 60px -20px rgba(0,0,0,.5);animation:mup .22s cubic-bezier(.2,.8,.2,1)}
@keyframes mup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mgrab{width:40px;height:5px;border-radius:999px;background:var(--muted);opacity:.35;margin:10px auto 6px;flex-shrink:0}
.mhead{display:flex;align-items:center;gap:12px;padding:6px 16px 12px;flex-shrink:0}
.mav{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(150deg,#06b6d4,#2563eb);box-shadow:0 8px 20px -8px rgba(37,99,235,.6)}
.mwho{flex:1;min-width:0}.mwho b{display:block;font-size:17px;letter-spacing:-.015em}.mwho small{display:block;font-size:12px;color:var(--muted)}
.mic2{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--chip);border:1px solid var(--hair);color:var(--ink)}
.msearch{display:flex;align-items:center;gap:8px;margin:0 16px 10px;height:44px;padding:0 14px;border-radius:14px;background:var(--input);border:1px solid var(--hair);color:var(--muted);flex-shrink:0}
.msearch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.mbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.msec{margin-bottom:14px}
.msec h5{margin:0 4px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcard{background:var(--glass);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);min-height:56px}
.mrow:last-child{border-bottom:0}
.mrow:active{background:var(--chip)}
.mi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.mt{flex:1;min-width:0}.mt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}.mt small{display:block;font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbadge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.mbadge.red{background:#ef4444;color:#fff}.mbadge.amber{background:rgba(245,158,11,.18);color:#b45309}.mbadge.soft{background:var(--chip);color:var(--muted);border:1px solid var(--hair)}
.mchev{color:var(--muted);opacity:.6;flex-shrink:0}
.mrow.danger b{color:#dc2626}
.mquick{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);background:var(--glass)}
.mq{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;border:1px solid var(--hair);background:var(--glass-strong);box-shadow:var(--shadow);font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:0}
.mq span{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.mempty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px}
.t-money{background:linear-gradient(150deg,#10b981,#059669)}.t-client{background:linear-gradient(150deg,#38bdf8,#0284c7)}.t-team{background:linear-gradient(150deg,#a78bfa,#7c3aed)}.t-day{background:linear-gradient(150deg,#fbbf24,#ea580c)}.t-acct{background:linear-gradient(150deg,#94a3b8,#64748b)}.t-task{background:linear-gradient(150deg,#22d3ee,#0891b2)}.t-red{background:linear-gradient(150deg,#f87171,#dc2626)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mbadge.amber{color:#fcd34d}}
:root[data-theme="dark"] .mbadge.amber{color:#fcd34d}
@media (min-width:540px){.msheet{border-radius:28px 28px 0 0}}

/* meetings */
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.gchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--chip);border:1px solid var(--hair);font-size:12.5px;max-width:100%}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip button{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;opacity:.7}
.gsub{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.rem{display:grid;grid-template-columns:128px 58px 1fr 32px;gap:6px;margin-bottom:8px;align-items:center}
.rem .in{height:40px;padding:0 10px;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:28px;height:28px;border-radius:999px;border:2px solid transparent}
.swatches button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.tl{position:relative;height:26px;border-radius:8px;background:var(--chip);border:1px solid var(--hair);overflow:hidden;margin:4px 0 10px}
.tl i{position:absolute;top:0;bottom:0;background:rgba(100,116,139,.55)}
.tl b{position:absolute;top:0;bottom:0;background:rgba(14,165,233,.35);border-left:2px solid #0ea5e9;border-right:2px solid #0ea5e9}
.tlh{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:-6px;margin-bottom:8px}
.gbadge{display:inline-flex;min-width:18px;height:18px;border-radius:999px;background:#0ea5e9;color:#fff;font-size:10.5px;font-weight:700;align-items:center;justify-content:center;padding:0 5px;margin-left:4px}
#tRowStart{overflow:hidden}
.tstrip{display:flex;align-items:center;gap:8px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none;height:100%}
.tstrip::-webkit-scrollbar{display:none}
.addhdr{padding:10px 12px 12px!important;padding-top:calc(10px + env(safe-area-inset-top,0px))!important;gap:8px;animation:capin .22s ease-out}
.addhdr[hidden]{display:none!important}
@keyframes capin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.addhdr{animation:none}}
.caphd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.04em;color:var(--capfg);opacity:.85}

.capgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.capc{display:flex;flex-direction:column;gap:1px;padding:7px 8px;border-radius:12px;background:var(--capcell);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.28);color:var(--capfg);min-width:0;font-variant-numeric:tabular-nums}
.capc.full{background:rgba(239,68,68,.28)}
.capl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.capc b{font-size:16px;font-weight:800;line-height:1.15;white-space:nowrap}
.capc b small{font-size:10.5px;font-weight:600;opacity:.85}
.capb{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sech{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 4px 4px}
.dcard{padding:12px!important}
.dhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.dhead h4{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtn{height:32px!important;padding:0 11px!important;font-size:12.5px!important;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dchip{display:flex;align-items:center;justify-content:space-between;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;min-width:0;font-variant-numeric:tabular-nums}
.dchip .dl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shadd{display:flex;align-items:flex-start;gap:8px}

.shin{flex:1;min-width:120px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;outline:none;height:32px}
.shchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--chip);font-size:13px;max-width:100%;overflow:hidden}
.shchip button{border:0;background:transparent;color:var(--muted);font-size:16px;width:22px;height:22px;cursor:pointer}
.shsel{height:36px;border-radius:10px;border:0;background:var(--chip);color:var(--ink);font:inherit;font-size:13px;padding:0 8px;max-width:150px}
.shrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--hair)}
.shrow .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shrow .m b,.shrow .m small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shrow .m small{color:var(--muted);font-size:12px;white-space:normal}
.shrow .m .shsel{align-self:flex-start;background:transparent;padding:0;height:24px;font-weight:700;font-size:14px;max-width:100%}
.shav{width:34px;height:34px;flex-shrink:0;border-radius:999px;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800;font-size:14px}
.shav.on{background:#16a34a}
.shown{font-size:13px;color:var(--muted)}
.ksheet{border-collapse:collapse;font-size:12px;min-width:640px;width:100%}

.ksheet tr.kex td{color:var(--muted);font-style:italic}
.rpills .pill.ok{color:#16a34a;font-weight:700}.rpills .pill.od{color:#dc2626;font-weight:700}
.chip.team{color:#7c3aed}

:root[data-theme="dark"] .chip.team{color:#c4b5fd}:root[data-theme="dark"] .rpills .pill.ok{color:#4ade80}:root[data-theme="dark"] .rpills .pill.od{color:#f87171}
.toast .undo{margin-left:12px;border:0;background:transparent;color:#7dd3fc;font:inherit;font-weight:800;cursor:pointer;padding:2px 4px}

.doubtTag{flex-shrink:0;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;background:#f59e0b;color:#111;font-size:12px;font-weight:900}

.sumcol{min-width:0;display:flex;flex-direction:column;gap:4px}

.cyan{padding-bottom:12px!important}

.dk span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- compact card: title + circle / chips + date,hours / icons + time / actual ---- */
.row{padding:10px 10px 10px 14px!important}
.rtop{display:flex;align-items:flex-start;gap:8px}

let S=null;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return;}}catch(e){}S=seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();
try{S.expenses=(S.expenses||[]).map(e=>e.occ?e:{id:e.id||uid(),payee:e.payee||"",kind:"REGULAR",timing:"PREPAID",cat:e.cat,note:e.note||"",plan:"ONE_TIME",rec:null,amount:e.amount,remind:0,occ:[{id:uid(),amount:e.amount,due:e.date,status:"PAID",paidAt:e.date,method:"BANK",ref:"",tds:e.tds||0,tdsPct:e.tdsPct||0,notified:true}]});if(S.settings&&!S.settings.expenseCategories.includes("Utilities"))S.settings.expenseCategories.splice(-1,0,"Utilities");}catch(e){}

/* ---------- helpers ---------- */
const me=()=>S.users.find(u=>u.id===S.me);
const role=()=>me()?me().role:null;
const userById=id=>S.users.find(u=>u.id===id);
const clientById=id=>S.clients.find(c=>c.id===id);
const first=n=>n.split(" ")[0];
const fmtMin=m=>{const h=Math.floor(m/60),mm=m%60;if(!h)return `${mm}m`;return mm?`${h}h ${mm}m`:`${h} Hours`.replace("1 Hours","1 Hour");};
const shortLabel=l=>{const w=l.trim().split(/\s+/)[0]||"";return w.length>6?w.slice(0,5):w;};
const pillHours=m=>{const h=Math.round(m/60*10)/10;return Number.isInteger(h)?String(h):h.toFixed(1);};
const fmtH=m=>{const h=m/60;return (Number.isInteger(h)?h:h.toFixed(1))+" Hours";};
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}).replace(" ","").toLowerCase():"—";
const fmtD=iso=>iso?new Date(iso).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}):"—";
const fmtDY=iso=>iso?new Date(iso).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fyStart=(d=new Date())=>{const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return new Date(y,3,1);};
const fyEnd=(d=new Date())=>{const s=fyStart(d);return new Date(s.getFullYear()+1,2,31,23,59,59);};
const inFY=(iso,ref=new Date())=>{const t=new Date(iso);return t>=fyStart(ref)&&t<=fyEnd(ref);};
