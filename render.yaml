# Render blueprint — one always-on web service (Docker) + managed Postgres.
# Real-time updates (SSE) and the inline job scheduler both need a single long-running process, which this gives.
#
# SAFE BY DEFAULT (ADR 0020): demo sign-in off, no demo seed, real Google. The server refuses to start in production
# without GOOGLE_MOCK=false and real secrets. For a throw-away staging / demo deployment ONLY, set DEMO_LOGIN=true,
# SEED_DEMO=true, GOOGLE_MOCK=true and ALLOW_DEMO_IN_PRODUCTION=true (UNSAFE: never with real client data).
services:
  - type: web
    name: eom-task-manager
    runtime: docker
    plan: starter # paid, always on (no spin-down); the inline job runner and live updates need a running process
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eom-postgres
          property: connectionString
      - key: JOBS_INLINE
        value: "true"
      - key: DEMO_LOGIN
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: GOOGLE_MOCK
        value: "false"
      - key: ALLOW_DEMO_IN_PRODUCTION
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Public URLs: the site's own https address (sign-in redirects, tracking links, WhatsApp PDF links)
      - key: AUTH_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Required for real Google sign-in and integrations:
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_BASE64
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false
      - key: GOOGLE_FINANCE_SENDER
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
databases:
  - name: eom-postgres
    plan: basic-256mb # paid managed Postgres: daily backups + point-in-time restore (free Postgres expires after 30 days)
    region: singapore
